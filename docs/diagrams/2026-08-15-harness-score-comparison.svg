<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Harness 十分制综合评分对比</title>
  <desc id="desc">基于公开资料和当前源码评估的 Harness 综合评分，GitHub Explorer 当前为 6.8 分。</desc>
  <style>
    .title { font:700 24px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill:#0f172a; }
    .label { font:600 16px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill:#0f172a; }
    .small { font:13px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill:#475569; }
    .grid { stroke:#cbd5e1; stroke-width:1; }
  </style>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="50" y="55" class="title">公开 Harness 综合评分（10 分制）</text>
  <text x="50" y="83" class="small">工程判断，不是官方排名；评分时点：2026-08-15；Explorer 以当前源码和 270 项后端测试为依据。</text>
  <line x1="300" y1="125" x2="1100" y2="125" class="grid"/>
  <line x1="300" y1="185" x2="1100" y2="185" class="grid"/>
  <line x1="300" y1="245" x2="1100" y2="245" class="grid"/>
  <line x1="300" y1="305" x2="1100" y2="305" class="grid"/>
